<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAMAKU | Suscripción</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Cinzel:wght@700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{min-height:100vh;margin:0;padding:20px;display:grid;place-items:center;color:#eee;background:radial-gradient(circle at 70% 20%,rgba(191,149,63,.18),transparent 35%),#050505;font-family:Montserrat}.card{width:min(540px,100%);padding:38px;text-align:center;background:#101010;border:1px solid rgba(191,149,63,.28);border-radius:25px;box-shadow:0 30px 80px #000}.logo{color:#d8ae4c;font:700 1.1rem Cinzel;letter-spacing:5px}.icon{width:70px;height:70px;margin:28px auto;display:grid;place-items:center;color:#e6c66e;background:rgba(191,149,63,.1);border-radius:20px;font-size:2rem}.card h1{font-size:1.5rem}.card p{color:#888;font-size:.75rem;line-height:1.8}.contacto{margin:24px 0;padding:15px;color:#d5b45b;background:rgba(191,149,63,.08);border-radius:12px;font-size:.7rem}.card button{padding:13px 18px;color:#111;background:linear-gradient(135deg,#e8c96e,#b5872e);border:0;border-radius:11px;font-weight:700}</style></head><body><main class="card"><div class="logo">✦ TAMAKU</div><div class="icon">⌛</div><h1>Tu acceso necesita renovación</h1><p>La prueba gratuita o el periodo contratado ha finalizado. Tus datos permanecen seguros y estarán disponibles nuevamente cuando TAMAKU confirme la renovación.</p><div class="contacto">Comunícate con TAMAKU y envía el comprobante de transferencia para activar tu plan.</div><button id="salir">Cerrar sesión</button></main><script type="module">import{cerrarSesion}from'../assets/js/core/session.js';document.getElementById('salir').onclick=cerrarSesion;</script></body></html>
