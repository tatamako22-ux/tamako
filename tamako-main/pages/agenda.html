<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>TAMAKU | Agenda Maestra</title>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    >

    <link rel="stylesheet" href="../assets/css/menu.css">
    <link rel="stylesheet" href="../assets/css/agenda.css?v=3">
<link rel="stylesheet" href="../assets/css/notifications.css?v=1">
<script src="../assets/js/core/notifications.js?v=1" defer></script>
</head>

<body>

    <aside class="sidebar"></aside>

    <!-- MOBILE NAV -->
    <nav class="mobile-tab-bar"></nav>
    <!-- MAIN -->
    <main class="main-content">

        <header class="agenda-header agenda-header-v3 tamaku-module-header">
            <div class="agenda-title-row">
                <div>
                    <span class="agenda-eyebrow">CONTROL DE CITAS</span>
                    <h1>Agenda Maestra</h1>
                    <p>Organiza el día de tu equipo y mantén cada cita bajo control.</p>
                </div>
                <a class="agenda-new-booking" href="#agendaGrid">
                    <i class="fa-solid fa-clock"></i>
                    <span>Ver disponibilidad</span>
                </a>
            </div>

            <div class="calendar-strip-shell">
                <div class="calendar-strip" id="miniCalendarStrip"></div>
            </div>

            <div class="controls-row agenda-toolbar">
                <div class="date-selector">
                    <button class="date-btn" id="prevDay" type="button" aria-label="Día anterior">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <div class="current-date-block">
                        <small>FECHA SELECCIONADA</small>
                        <span id="fechaActual">Cargando...</span>
                    </div>
                    <button class="date-btn" id="nextDay" type="button" aria-label="Día siguiente">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
                <div class="professional-selector-wrap">
                    <label for="mobileBarberSelector">
                        <i class="fa-solid fa-user-tie"></i>
                        PROFESIONAL
                    </label>
                    <select id="mobileBarberSelector"></select>
                </div>
            </div>
        </header>

        <div class="agenda-wrapper">

            <div
                id="agendaGrid"
                class="agenda-grid"
            ></div>

        </div>

    </main>

    <!-- MODAL NUEVA RESERVA -->
    <div id="reservaModal" class="modal">

        <div class="modal-content">

            <span
                class="close-modal"
                id="closeReserva"
            >
                &times;
            </span>

            <h2>
                ✦ Nueva Reserva ✦
            </h2>

            <div id="infoReserva"></div>

            <!-- NUEVO SELECTOR DE SERVICIO -->
            <select 
                id="res_servicio" 
                style="width:100%; padding:12px; margin-bottom:15px; background:#111; border:1px solid rgba(191,149,63,0.3); color:white; border-radius:12px; outline:none;"
            >
                <option value="">Cargando servicios...</option>
            </select>

            <input
                type="text"
                id="res_nombre"
                placeholder="Nombre del Cliente"
                autocomplete="off"
            >

            <input
                type="tel"
                id="res_tel"
                placeholder="Teléfono (Ej: 3001234567)"
                autocomplete="off"
            >

            <button
                class="btn-gold"
                id="btnConfirmarReserva"
            >
                Confirmar Cita
            </button>

        </div>

    </div>
    <div id="modalWhatsapp" class="modal">

    <div class="modal-content">

        <h2>✅ Cita creada</h2>

        <p id="textoWhatsapp"></p>

        <button
            id="btnEnviarWhatsapp"
            class="btn-gold"
        >
            🟢 Enviar WhatsApp
        </button>

        <button
            id="btnCerrarWhatsapp"
            style="
                margin-top:10px;
                width:100%;
                padding:12px;
                border:none;
                border-radius:40px;
                cursor:pointer;
            "
        >
            Cerrar
        </button>

    </div>

</div>
    <!-- MODAL CANCELAR -->
    <div id="confirmCancelModal" class="modal">

        <div
            class="modal-content"
            style="
                max-width:300px;
                text-align:center;
            "
        >

            <h2 style="font-size:1rem;">
                ¿Cancelar cita?
            </h2>

            <p
                style="
                    color:#aaa;
                    margin:20px 0;
                    font-size:0.8rem;
                "
            >
                Esta acción eliminará la cita permanentemente.
            </p>

            <div style="display:flex; gap:10px;">

                <button
                    id="btnCancelarNo"
                    style="
                        flex:1;
                        padding:12px;
                        background:#222;
                        border:none;
                        color:#fff;
                        border-radius:50px;
                        cursor:pointer;
                    "
                >
                    VOLVER
                </button>

                <button
                    id="btnCancelarSi"
                    style="
                        flex:1;
                        padding:12px;
                        background:var(--danger);
                        border:none;
                        color:#fff;
                        border-radius:50px;
                        cursor:pointer;
                        font-weight:800;
                    "
                >
                    ELIMINAR
                </button>

            </div>

        </div>

    </div>

    <!-- MODAL EDITAR CLIENTE (DESDE AGENDA) -->
    <div id="modalEditarAgendaCliente" class="modal">
        <div class="modal-content" style="max-width: 400px;">
            <span class="close-modal" id="closeAgendaEdit">&times;</span>
            <h2 style="color: var(--gold-light, #ffd277); margin-bottom: 20px; font-size: 1.2rem; text-align:center;">✦ Editar Cliente ✦</h2>
            <input type="hidden" id="agendaEditIdCita">
            <input type="hidden" id="agendaEditTelOriginal">
            
            <div style="margin-bottom: 15px; text-align: left;">
                <label style="font-size: 0.65rem; color: #888; text-transform: uppercase; display: block; margin-bottom: 5px;">Nombre del Cliente</label>
                <input type="text" id="agendaEditNombre" placeholder="Nombre completo" style="width:100%; padding:12px; background:#111; border:1px solid rgba(191,149,63,0.3); color:white; border-radius:12px; outline:none;">
            </div>

            <div style="margin-bottom: 20px; text-align: left;">
                <label style="font-size: 0.65rem; color: #888; text-transform: uppercase; display: block; margin-bottom: 5px;">Teléfono / WhatsApp</label>
                <input type="tel" id="agendaEditTel" placeholder="3001234567" style="width:100%; padding:12px; background:#111; border:1px solid rgba(191,149,63,0.3); color:white; border-radius:12px; outline:none;">
            </div>

            <button class="btn-gold" id="btnGuardarAgendaEdit" style="width:100%; padding:14px; background:linear-gradient(145deg, #bf953f, #f5d487); border:none; border-radius:50px; color:#111; font-weight:800; cursor:pointer;">
                Actualizar Datos
            </button>
        </div>
    </div>
    <!-- TOAST -->
    <div id="toastAgenda" class="toast-agenda"></div>
    <!-- MENU -->
    <script src="../assets/js/core/menu.js?v=6" defer></script>

    <!-- AGENDA -->
    <script type="module">
        import { initAgenda } from "../assets/js/agenda/index.js";
        import { requireTiendaInfo } from "../assets/js/core/session.js";
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

        const supabaseUrl = "https://smibbddmwgdmqpwsuaqr.supabase.co";
        const supabaseKey = "sb_publishable_kQQ7ldmjql3V5Jbn9jvxYw_IAoSz1Uj";
        const supabase = createClient(supabaseUrl, supabaseKey);
        const tiendaValidada = await requireTiendaInfo();
        if (!tiendaValidada) throw new Error("No existe una tienda válida para esta sesión");

        // Exposición global estricta para eventos onclick
        window.abrirModalEditarAgenda = function(idCita, nombreActual, telActual) {
            console.log("✏️ Abriendo modal con:", idCita, nombreActual, telActual);
            document.getElementById("agendaEditIdCita").value = idCita || "";
            document.getElementById("agendaEditTelOriginal").value = telActual || "";
            document.getElementById("agendaEditNombre").value = nombreActual || "";
            document.getElementById("agendaEditTel").value = telActual || "";
            document.getElementById("modalEditarAgendaCliente").style.display = "flex";
        };

        window.cerrarModalAgendaEdit = function() {
            document.getElementById("modalEditarAgendaCliente").style.display = "none";
        };

        document.getElementById("closeAgendaEdit").onclick = window.cerrarModalAgendaEdit;

        document.getElementById("btnGuardarAgendaEdit").onclick = async () => {
            const idCita = document.getElementById("agendaEditIdCita").value;
            const telOriginal = document.getElementById("agendaEditTelOriginal").value;
            const nuevoNombre = document.getElementById("agendaEditNombre").value.trim();
            const nuevoTel = document.getElementById("agendaEditTel").value.replace(/\D/g, "").trim();

            if (!nuevoNombre || !nuevoTel) {
                alert("Por favor completa el nombre y el teléfono.");
                return;
            }

            const tiendaInfo = tiendaValidada;

            const btn = document.getElementById("btnGuardarAgendaEdit");
            btn.innerText = "ACTUALIZANDO...";

            // Actualizamos en Supabase buscando por ID de cita o por el teléfono original
            let query = supabase.from("citas").update({
                nombre_cliente: nuevoNombre,
                telefono_cliente: nuevoTel
            }).eq("id_tienda", tiendaInfo.id);

            if (idCita && idCita !== "undefined" && idCita !== "null") {
                query = query.eq("id_cita", idCita);
            } else {
                query = query.eq("telefono_cliente", telOriginal);
            }

            const { error } = await query;

            if (error) {
                console.error("Error al actualizar la cita:", error);
                alert("Hubo un error al actualizar los datos.");
            } else {
                alert("¡Datos del cliente actualizados con éxito!");
                window.cerrarModalAgendaEdit();
                window.location.reload();
            }
            btn.innerText = "Actualizar Datos";
        };

        initAgenda();
    </script>

</body>
</html>
