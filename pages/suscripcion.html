<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAMAKU | Estado de acceso</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Cinzel:wght@700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{min-height:100vh;margin:0;padding:20px;display:grid;place-items:center;color:#eee;background:radial-gradient(circle at 70% 20%,rgba(191,149,63,.18),transparent 35%),#050505;font-family:Montserrat}.card{width:min(560px,100%);padding:38px;text-align:center;background:#101010;border:1px solid rgba(191,149,63,.28);border-radius:25px;box-shadow:0 30px 80px #000}.logo{color:#d8ae4c;font:700 1.1rem Cinzel;letter-spacing:5px}.icon{width:70px;height:70px;margin:25px auto;display:grid;place-items:center;color:#e6c66e;background:rgba(191,149,63,.1);border-radius:20px;font-size:2rem}.estado{display:inline-block;padding:7px 11px;color:#ff8585;background:rgba(255,80,80,.1);border-radius:20px;font-size:.65rem;font-weight:700;letter-spacing:1px}.card h1{font-size:1.5rem}.card p{color:#999;font-size:.78rem;line-height:1.8}.datos{margin:22px 0;display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.datos div{padding:14px;background:#171717;border-radius:12px}.datos span,.datos strong{display:block}.datos span{color:#666;font-size:.55rem}.datos strong{margin-top:7px;color:#dfbd62;font-size:.78rem}.mensaje{margin:20px 0;padding:17px;color:#d5b45b;background:rgba(191,149,63,.08);border-left:3px solid #bf953f;border-radius:10px;font-size:.75rem;line-height:1.7}.card button{padding:13px 18px;color:#111;background:linear-gradient(135deg,#e8c96e,#b5872e);border:0;border-radius:11px;font-weight:700}@media(max-width:500px){.card{padding:27px 18px}.datos{grid-template-columns:1fr}}</style></head>
<body><main class="card"><div class="logo">✦ TAMAKU</div><div class="icon">⌛</div><span class="estado" id="estado">ACCESO RESTRINGIDO</span><h1 id="titulo">Tu acceso necesita renovación</h1><p>Tus datos permanecen seguros. Cuando TAMAKU confirme la renovación podrás continuar exactamente donde quedaste.</p><div class="datos"><div><span>VENCIMIENTO</span><strong id="vence">—</strong></div><div><span>ESTADO DE LA CUENTA</span><strong id="dias">—</strong></div></div><div class="mensaje" id="mensaje">Comunícate con TAMAKU y envía el comprobante para activar tu plan.</div><button id="salir">Cerrar sesión</button></main>
<script type="module">import{cerrarSesion}from'../assets/js/core/session.js';const info=JSON.parse(sessionStorage.getItem('tamaku_suscripcion')||'null')||{};const fecha=v=>v?new Date(v).toLocaleDateString('es-CO',{dateStyle:'long'}):'Sin fecha';document.getElementById('estado').textContent=info.estado_efectivo||info.estado||'VENCIDA';document.getElementById('vence').textContent=fecha(info.vence);const d=Number(info.dias_restantes||0),v=Number(info.dias_vencido||0);document.getElementById('dias').textContent=d>0?`${d} días de gracia restantes`:v>0?`${v} días de vencimiento`:'Vencida hoy';document.getElementById('mensaje').textContent=info.mensaje||'Comunícate con TAMAKU y envía el comprobante para activar tu plan.';if((info.estado_efectivo||info.estado)==='SUSPENDIDA')document.getElementById('titulo').textContent='Esta tienda fue suspendida';document.getElementById('salir').onclick=cerrarSesion;</script></body></html>
